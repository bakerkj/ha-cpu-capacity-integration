name: mypy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          cache-dependency-glob: "uv.lock"
          cache-suffix: mypy
      - name: Install the locked environment
        run: uv sync --frozen
      - name: Run mypy
        run: uv run --no-sync mypy custom_components/cpu_capacity
