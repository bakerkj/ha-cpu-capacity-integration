name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: tests
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install the locked environment
        run: uv sync --group test --frozen
      - name: Unit tests
        run: uv run --no-sync python -m pytest tests/ -v
